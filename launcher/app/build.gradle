plugins {
    id "com.android.application"
}

android {
    namespace "fi.koti.launcher"
    compileSdk 35

    defaultConfig {
        applicationId "fi.koti.launcher"
        minSdk 28          // Sony BRAVIA ATV3 runs Android 9
        targetSdk 28       // keep runtime behaviour identical to the TV's OS level
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.dynamicanimation:dynamicanimation:1.0.0"
}
